baseURL = "https://jpata.github.io"
title = "Joosep Pata"
theme = "gokarna"
languageCode = "en"
defaultContentLanguage = "en"
enableEmoji = true
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]

# Choose one of emacs, trac or perldoc
pygmentsStyle = "monokai"

[params]
  footer = "Joosep Pata"
  description = "Machine learning for scientific discovery, real-time reconstruction, and high-performance computing."
  avatarURL = "/img/avatar-icon.png"
  AvatarAltText = "Portrait of Joosep Pata"
  socialImage = "/img/social-card.png"
  avatarSize = "size-l"
  ShowBackToTopButton = true # true or false for "back to top" button on posts and pages
  socialIcons = [
    {name = "github", url = "https://github.com/jpata"},
    {name = "linkedin", url = "https://linkedin.com/in/joosep-pata"},
    {name = "email", url = "mailto:joosep.pata@gmail.com"}
  ]
  accentColor = "#FF4D4D"

[menu]
  [[menu.main]]
    name = "Research"
    url = "/page/research/"
    weight = 1

  [[menu.main]]
    name = "Applications"
    url = "/page/applications/"
    weight = 2

  [[menu.main]]
    name = "Supervision"
    url = "/page/supervision/"
    weight = 3

  [[menu.main]]
    name = "Talks"
    url = "/page/talks/"
    weight = 4

  [[menu.main]]
    name = "News"
    url = "/updates/"
    weight = 5

  [[menu.main]]
    name = "CV"
    url = "/page/resume/"
    weight = 6

[markup]
  [markup.tableOfContents]
    startLevel = 1
    endLevel = 4
    ordered = false
